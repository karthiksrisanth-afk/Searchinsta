name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Archive
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip project file found in repository root."
            exit 1
          fi
          echo "Found project archive: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Discover Project Root
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::settings.gradle standard structure not found inside archive."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Network Permissions Cleanly
        run: |
          MANIFEST_FILE=$(find extracted -name "AndroidManifest.xml" | head -1)
          if [ -f "$MANIFEST_FILE" ]; then
            # Safely inject network permissions if not already present
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_FILE"
            fi
            if ! grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_FILE"
            fi
            
            # Ensure usesCleartextTraffic="true" without duplicating
            if grep -q "android:usesCleartextTraffic" "$MANIFEST_FILE"; then
              sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' "$MANIFEST_FILE"
            else
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST_FILE"
            fi
          fi

      - name: Apply Build Properties and Dependency Fixes
        run: |
          PROPS_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/gradle.properties"
          BUILD_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/build.gradle"

          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"
          echo "org.gradle.parallel=true" >> "$PROPS_FILE"
          echo "org.gradle.caching=true" >> "$PROPS_FILE"
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> "$PROPS_FILE"

          if [ -f "$BUILD_FILE" ]; then
            echo "" >> "$BUILD_FILE"
            echo "allprojects {" >> "$BUILD_FILE"
            echo "    configurations.all {" >> "$BUILD_FILE"
            echo "        resolutionStrategy {" >> "$BUILD_FILE"
            echo "            eachDependency { details ->" >> "$BUILD_FILE"
            echo "                if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {" >> "$BUILD_FILE"
            echo "                    details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> "$BUILD_FILE"
            echo "                }" >> "$BUILD_FILE"
            echo "            }" >> "$BUILD_FILE"
            echo "        }" >> "$BUILD_FILE"
            echo "    }" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
          fi

      - name: Set up Java 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Optimized Debug APK
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --parallel --build-cache --stacktrace
          else
            gradle assembleDebug --parallel --build-cache --stacktrace
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDataSearch-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
