name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "Error: No project ZIP file found in the repository."
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Android Project Directory
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Error: Android project (settings.gradle) not found inside ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX and Fix Kotlin Duplicate Classes
        run: |
          PROPS_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/gradle.properties"
          BUILD_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/build.gradle"
          
          # Enable AndroidX
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"
          
          # Append Kotlin dependency resolution strategy to root build.gradle to fix duplicate classes
          if [ -f "$BUILD_FILE" ]; then
            cat << 'EOF' >> "$BUILD_FILE"

allprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                        details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                    }
                }
            }
        }
    }
}
EOF
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK with Gradle
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDataSearch-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
