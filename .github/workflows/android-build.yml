name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Archive
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip project file found in repository root."
            exit 1
          fi
          echo "Found project archive: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Discover Project Root
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::settings.gradle standard structure not found inside archive."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Network & Deep Linking Permissions
        run: |
          MANIFEST_FILE=$(find extracted -name "AndroidManifest.xml" | head -1)
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_FILE"
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_FILE"
            fi
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST_FILE"
          fi

      - name: Apply Modern Build Configuration Patches
        run: |
          PROPS_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/gradle.properties"
          BUILD_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/build.gradle"

          # Modern Gradle Performance & AndroidX flags
          cat << 'EOF' >> "$PROPS_FILE"

android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
EOF

          # Inject Resolution Strategy to unify Kotlin Stdlib dependencies
          if [ -f "$BUILD_FILE" ]; then
            cat << 'EOF' >> "$BUILD_FILE"

allprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && 
                   (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                    details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                }
            }
        }
    }
}
EOF
          fi

      - name: Set up Java 17 with Advanced Gradle Caching
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Optimized Debug APK
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --parallel --build-cache --stacktrace
          else
            gradle assembleDebug --parallel --build-cache --stacktrace
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDataSearch-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
