name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "Error: No project ZIP file found in the repository."
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Android Project Directory
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Error: Android project (settings.gradle) not found inside ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX Support
        run: |
          PROPS_FILE="$GITHUB_WORKSPACE/$PROJECT_DIR/gradle.properties"
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK with Gradle
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDataSearch-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
